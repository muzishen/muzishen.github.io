<!-- end custom head snippets -->
<style>
/* —— 全站正文略微变小 —— */
@media (min-width: 768px) {
  .page__content p,
  .page__content li,
  .page__content td,
  .page__content th {
    font-size: 0.9rem;   /* 调小一点；想更小改成 0.92/0.9 */
    line-height: 1.7;     /* 读起来更舒服 */
  }
  /* 可选：小一点的副标题 */
  .page__content h2 { font-size: 1.5rem; }
  .page__content h3 { font-size: 1.25rem; }
}
</style>





<style>
/* —— 论文条目：两列布局 —— */
.pub-row{
  display:flex;
  gap:18px;                /* 左右间隔 */
  align-items:flex-start;
  margin:18px 0;
}

/* 左列：固定列宽，可按需改 300~360px */
.pub-left{ flex:0 0 300px; }

/* 图片容器：用于“固定显示高度 + 居中” */
.pub-left .thumb{
  width:100%;
  height:200px;            /* ← 想更高改这里，如 260/280 */
  display:flex;
  justify-content:center;  /* 水平居中 */
  align-items:center;      /* 垂直居中 */
  overflow:hidden;         /* 防止外溢 */
}

/* 图片：按比例显示，不拉伸 */
.pub-left img{
  max-width:100%;
  max-height:100%;
  width:auto;              /* 覆盖 width="100%" 的影响 */
  height:auto;
  object-fit:contain;      /* 完整显示；想铺满可改 cover */
  display:block;
}

/* 右列：占满剩余宽度 */
.pub-right{ flex:1; }

/* 移动端：上下堆叠 */
@media (max-width: 768px){
  .pub-row{ flex-direction:column; }
  .pub-left{ flex:none; width:100%; }
  .pub-left .thumb{ height:auto; }
  .pub-left img{ width:100%; height:auto; object-fit:contain; }
}
</style>
