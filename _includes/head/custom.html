<!-- start custom head snippets -->

<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>

<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- end custom head snippets -->
<style>
/* —— 全站正文略微变小 —— */
@media (min-width: 768px) {
  .page__content p,
  .page__content li,
  .page__content td,
  .page__content th {
    font-size: 0.95rem;   /* 调小一点；想更小改成 0.92/0.9 */
    line-height: 1.7;     /* 读起来更舒服 */
  }
  /* 可选：小一点的副标题 */
  .page__content h2 { font-size: 1.5rem; }
  .page__content h3 { font-size: 1.25rem; }
}
</style>


<style>
/* 统一 paper-box 为两列布局 */
.paper-box{
  display:flex; gap:16px; align-items:flex-start;
  margin: 18px 0;
}
/* 图片列固定为较窄宽度，避免过大 */
.paper-box-image{ flex:0 0 240px; }       /* 想更小可改成 220px */
.paper-box-image img{
  width:100%; height:auto;
  max-height:170px;                        /* 控制高度，避免过高 */
  object-fit:cover;                        /* 保持填充，必要时会轻微裁切 */
  display:block;
}
/* 文字列占满剩余空间 */
.paper-box-text{ flex:1; }

/* 移动端下堆叠显示 */
@media (max-width: 768px){
  .paper-box{ flex-direction:column; }
  .paper-box-image{ flex: none; width:100%; }
  .paper-box-image img{ max-height:none; object-fit:contain; }
}
</style>
