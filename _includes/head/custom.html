<!-- end custom head snippets -->
<style>
/* —— 全站正文略微变小 —— */
@media (min-width: 768px) {
  .page__content p,
  .page__content li,
  .page__content td,
  .page__content th {
    font-size: 0.95rem;   /* 调小一点；想更小改成 0.92/0.9 */
    line-height: 1.7;     /* 读起来更舒服 */
  }
  /* 可选：小一点的副标题 */
  .page__content h2 { font-size: 1.5rem; }
  .page__content h3 { font-size: 1.25rem; }
}
</style>



<style>
/* 让左侧图片列居中对齐，并可调列宽 */
.paper-box { display:flex; gap:16px; align-items:flex-start; }
.paper-box-image{
  flex: 0 0 300px;           /* ← 列宽，想更大改成 320/340px */
  display:flex;
  justify-content:center;    /* 水平居中 */
  align-items:center;        /* 垂直居中 */
}
/* 图片尺寸：保持比例，允许更高一些 */
.paper-box-image img{
  width: auto;               /* 不强制100%宽 */
  max-width: 100%;           /* 但不超过列宽 */
  max-height: 220px;         /* ← 想更高改成 240/260px */
  object-fit: contain;       /* 完整显示，不裁切 */
  display:block;
}
/* 文字列占剩余空间 */
.paper-box-text{ flex:1; }

/* 移动端下改为上下布局 */
@media (max-width: 768px){
  .paper-box{ flex-direction:column; }
  .paper-box-image{ flex: none; width:100%; }
  .paper-box-image img{ max-height:none; width:100%; object-fit:contain; }
}
</style>
