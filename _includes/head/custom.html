<style>
/* —— 全站正文略微变小 —— */
@media (min-width: 768px) {
  .page__content p,
  .page__content li,
  .page__content td,
  .page__content th {
    font-size: 0.95rem;   /* 调小一点；想更小改成 0.92/0.9 */
    line-height: 1.7;     /* 读起来更舒服 */
  }
  /* 可选：小一点的副标题 */
  .page__content h2 { font-size: 1.5rem; }
  .page__content h3 { font-size: 1.25rem; }
}
</style>



<style>
/* 卡片整体：两列布局 */
.paper-box{
  display:flex;
  gap:18px;
  align-items:flex-start;
  margin:18px 0;
}

/* 左侧图片列宽度（可改 280~340px） */
.paper-box-image{
  flex: 0 0 300px;
}

/* 建一个“容器高度”，用来垂直居中图片 */
.paper-box-image > div{
  width:100%;
  height: 220px;              /* ← 想更高就改这里，如 260px/280px */
  display:flex;
  justify-content:center;     /* 水平居中 */
  align-items:center;         /* 垂直居中 */
  overflow:hidden;            /* 防止超出容器 */
}

/* 图片：按比例显示、不要被拉伸 */
.paper-box-image img{
  max-width:100%;
  max-height:100%;
  width:auto !important;      /* 覆盖 <img width="100%"> */
  height:auto !important;
  object-fit: contain;        /* 完整显示（不裁切）; 想充满可改 cover */
  display:block;
}

/* 右侧文本列占满剩余空间 */
.paper-box-text{ flex:1; }

/* 移动端：上下堆叠，图片占满宽度，高度自适应 */
@media (max-width: 768px){
  .paper-box{ flex-direction:column; }
  .paper-box-image{ flex:none; width:100%; }
  .paper-box-image > div{ height:auto; }
  .paper-box-image img{ width:100% !important; height:auto !important; object-fit:contain; }
}
</style>
